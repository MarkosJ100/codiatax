name: Backup Supabase Database
on:
  schedule:
    # Cada domingo a las 10:00 UTC
    - cron: "0 10 * * 0"
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create database backup
        run: |
          mkdir -p backups
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="backups/supabase-backup-$(date -u +%Y-%m-%d_%H-%M-%S).dump"
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-backup
          path: backups/*.dump
          retention-days: 30
