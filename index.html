<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codiatx Version Web 1.0</title>
    <style>
      body { margin: 0; background: #0f172a; }
      #boot-error {
        display: none;
        position: fixed; inset: 0; z-index: 9999;
        background: #0f172a;
        flex-direction: column; align-items: center; justify-content: center;
        color: #f87171; font-family: sans-serif; font-size: 13px;
        padding: 24px; text-align: center; gap: 12px;
      }
    </style>
  </head>
  <body>
    <div id="boot-error">
      <span style="font-size:2.5rem">⚠️</span>
      <p id="boot-error-msg" style="max-width:320px;word-break:break-all;margin:0"></p>
      <button onclick="location.reload()" style="margin-top:12px;padding:10px 24px;border-radius:12px;background:#7c3aed;color:white;border:none;font-weight:700;cursor:pointer">Reintentar</button>
    </div>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, src, line) {
        var el = document.getElementById('boot-error');
        var msgEl = document.getElementById('boot-error-msg');
        if (el && msgEl) {
          msgEl.textContent = 'Error: ' + (msg || 'desconocido') + (src ? '\n' + src + ':' + line : '');
          el.style.display = 'flex';
        }
        return false;
      };
      window.onunhandledrejection = function(e) {
        var el = document.getElementById('boot-error');
        var msgEl = document.getElementById('boot-error-msg');
        if (el && msgEl) {
          msgEl.textContent = 'Error: ' + (e.reason?.message || e.reason || 'desconocido');
          el.style.display = 'flex';
        }
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
